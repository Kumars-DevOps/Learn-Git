[defaults]
# Path to your inventory file
inventory = ./hosts.ini
# The default user for the SSH connection
remote_user = ec2-user
# Path to your PEM file
private_key_file = ./dectech.pem
# Skip the "Are you sure you want to connect (yes/no)?" prompt
host_key_checking = False

[privilege_escalation]
# Enable sudo (equivalent to --become)
become = True
# Method to use for escalation
become_method = sudo
# The user to become (root)
become_user = root
# Ask for password? (False for EC2 as pem keys allow passwordless sudo)
become_ask_pass = False

[ssh_connection]
# This line is the critical fix for Termux/PRoot
ssh_args = -o ControlMaster=no -o ControlPersist=no
# Disable pipelining to avoid socket errors
pipelining = False
	
